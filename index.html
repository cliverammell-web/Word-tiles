<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E7E3DA">
<meta name="description" content="Wortquartett — vier Gruppen zu je vier Wörtern. Ein deutsches Wortspiel, offline spielbar.">
<link rel="manifest" href="/word-quartet/manifest.json">
<link rel="apple-touch-icon" href="/word-quartet/apple-touch-icon.png">
<link rel="icon" href="/word-quartet/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wortquartett">
<title>Wortquartett</title>
<style>
:root{
  --ral1021:#EDB800; --ral6018:#5A8F3D; --ral5015:#00699C; --ral4008:#7B4B79;
  --paper:#E7E3DA; --tile:#FBFAF7; --rule:#C3BCAE;
  --ink:#1F1E1A; --dim:#6E6A60;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper); color:var(--ink); min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; justify-content:center; padding:12px 10px 20px; touch-action:manipulation;
}
.wrap{width:100%; max-width:440px; display:flex; flex-direction:column; gap:11px}

.top{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1.5px solid var(--ink); padding-bottom:7px}
h1{font-size:1.32rem; font-weight:700; letter-spacing:.16em; line-height:1}
.sub{font-size:.63rem; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin-top:5px}
.pz{font-size:.63rem; letter-spacing:.1em; color:var(--dim); text-align:right; line-height:1.5}
.pz b{display:block; font-size:1.15rem; letter-spacing:.02em; color:var(--ink)}

.bands{display:flex; flex-direction:column; gap:6px}
.band{border-radius:3px; padding:9px 11px; color:#fff; position:relative;
  animation:drop .32s cubic-bezier(.2,.8,.3,1)}
@keyframes drop{from{opacity:0; transform:translateY(-9px)}to{opacity:1; transform:none}}
.band.t0{background:var(--ral1021); color:#332900}
.band.t1{background:var(--ral6018)}
.band.t2{background:var(--ral5015)}
.band.t3{background:var(--ral4008)}
.band .cat{font-size:.76rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding-right:52px}
.band .wds{font-size:.86rem; margin-top:3px; letter-spacing:.02em}
.band .ral{position:absolute; top:8px; right:9px; font-size:.53rem; letter-spacing:.06em;
  opacity:.6; font-family:ui-monospace,Menlo,monospace}

.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.cell{
  background:var(--tile); border:1px solid var(--rule); border-radius:3px;
  aspect-ratio:1/.82; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:3px 2px; cursor:pointer; font-family:inherit;
  font-weight:600; letter-spacing:.02em; color:var(--ink);
  word-break:break-word; hyphens:none; line-height:1.12;
  transition:background .12s, transform .09s;
}
.cell:active{transform:scale(.96)}
.cell.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.cell.shake{animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
.s1{font-size:.86rem}.s2{font-size:.76rem}.s3{font-size:.63rem}.s4{font-size:.55rem}

.status{display:flex; align-items:center; justify-content:space-between; min-height:22px}
.lives{display:flex; align-items:center; gap:6px; font-size:.66rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--dim)}
.dot{width:10px; height:10px; border-radius:50%; background:var(--ink)}
.dot.gone{background:none; box-shadow:inset 0 0 0 1px var(--rule)}
.note{font-size:.74rem; color:var(--dim); text-align:right}
.note.warn{color:#A33224; font-weight:600}

.btns{display:grid; grid-template-columns:1fr 1fr; gap:7px}
button.b{font-family:inherit; font-size:.78rem; font-weight:600; letter-spacing:.05em;
  padding:11px 6px; border-radius:3px; border:1.5px solid var(--ink);
  background:none; color:var(--ink); cursor:pointer}
button.b:active{background:var(--ink); color:var(--paper)}
button.b:disabled{opacity:.3; cursor:default}
button.b.go{grid-column:1/-1; background:var(--ink); color:var(--paper)}
button.b.go:disabled{background:none; color:var(--ink)}

.result{display:none; border:1.5px solid var(--ink); border-radius:3px; padding:14px 13px; text-align:center}
.result.on{display:block; animation:drop .3s cubic-bezier(.2,.8,.3,1)}
.result h2{font-size:1.02rem; letter-spacing:.1em; text-transform:uppercase}
.result p{font-size:.79rem; color:var(--dim); margin-top:6px; line-height:1.5}
.result .hint{font-size:.72rem; margin-top:9px; padding-top:9px; border-top:1px solid var(--rule); text-align:left}
.rbtns{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:13px}
.rbtns button{font-family:inherit; font-size:.78rem; font-weight:600; letter-spacing:.05em;
  padding:11px 6px; border-radius:3px; border:1.5px solid var(--ink);
  background:var(--ink); color:var(--paper); cursor:pointer}
.rbtns button.ghost{background:none; color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>WORTQUARTETT</h1>
      <div class="sub">Vier Gruppen zu je vier Wörtern</div>
    </div>
    <div class="pz">Rätsel<b id="pznum">1</b></div>
  </div>

  <div class="bands" id="bands"></div>
  <div class="grid" id="grid"></div>

  <div class="status" id="status">
    <div class="lives">Fehler <span id="dots"></span></div>
    <div class="note" id="note"></div>
  </div>

  <div class="btns" id="btns">

    <button class="b" id="b-clear" onclick="clearSel()">Auswahl aufheben</button>
    <button class="b go" id="b-go" onclick="submit()">Prüfen</button>
  </div>

  <div class="result" id="result"></div>
</div>

const RAL=["RAL 1021","RAL 6018","RAL 5015","RAL 4008"];

let pIdx=0, tiles=[], solved=[], sel=[], mistakes=0, tried=[], done=false;

function load(i){
  pIdx=((i%PUZZLES.length)+PUZZLES.length)%PUZZLES.length;
  tiles=[]; PUZZLES[pIdx].g.forEach((g,gi)=>g.w.forEach(w=>tiles.push({w,gi})));
  shuffle(tiles);
  solved=[]; sel=[]; mistakes=0; tried=[]; done=false;
  document.getElementById('pznum').textContent=pIdx+1;
  const r=document.getElementById('result');
  r.classList.remove('on'); r.innerHTML='';
  document.getElementById('status').style.display='';
  document.getElementById('btns').style.display='';
  window.scrollTo(0,0);
  note(''); render();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function sizeClass(w){return w.length<=6?'s1':w.length<=8?'s2':w.length<=11?'s3':'s4';}

function render(){
  const bands=document.getElementById('bands'); bands.innerHTML='';
  solved.forEach(gi=>{
    const g=PUZZLES[pIdx].g[gi], d=document.createElement('div');
    d.className='band t'+g.t;
    d.innerHTML='<div class="ral">'+RAL[g.t]+'</div>'+
      '<div class="cat">'+g.cat+'</div>'+
      '<div class="wds">'+g.w.join(' · ')+'</div>';
    bands.appendChild(d);
  });

  const grid=document.getElementById('grid'); grid.innerHTML='';
  tiles.filter(t=>!solved.includes(t.gi)).forEach(t=>{
    const b=document.createElement('button');
    b.className='cell '+sizeClass(t.w)+(sel.includes(t.w)?' on':'');
    b.textContent=t.w;
    b.onclick=()=>pick(t.w);
    grid.appendChild(b);
  });

  let dots=''; for(let i=0;i<4;i++) dots+='<span class="dot'+(i<mistakes?' gone':'')+'"></span>';
  document.getElementById('dots').innerHTML=dots;

  document.getElementById('b-go').disabled=done||sel.length!==4;
  document.getElementById('b-clear').disabled=done||!sel.length;
}

function note(txt,warn){
  const n=document.getElementById('note');
  n.textContent=txt; n.className='note'+(warn?' warn':'');
}

function pick(w){
  if(done) return;
  const i=sel.indexOf(w);
  if(i>-1) sel.splice(i,1);
  else{ if(sel.length===4) return; sel.push(w); }
  note(''); render();
}
function clearSel(){ sel=[]; note(''); render(); }
function doShuffle(){ shuffle(tiles); render(); }

function submit(){
  if(done||sel.length!==4) return;
  const key=sel.slice().sort().join('|');
  if(tried.includes(key)){ note('Schon versucht!',true); shakeSel(); return; }
  tried.push(key);

  const gis=sel.map(w=>tiles.find(t=>t.w===w).gi);
  const first=gis[0];
  if(gis.every(g=>g===first)){
    solved.push(first); sel=[];
    if(solved.length===4){ done=true; render(); finish(true); return; }
    note('Richtig!'); render(); return;
  }

  const counts={}; gis.forEach(g=>counts[g]=(counts[g]||0)+1);
  const best=Math.max(...Object.values(counts));
  mistakes++; shakeSel();
  if(mistakes>=4){ done=true; solved=[0,1,2,3]; sel=[]; render(); finish(false); return; }
  note(best===3?'Eins daneben!':'Leider falsch.',true);
  render();
}

function shakeSel(){
  document.querySelectorAll('.cell.on').forEach(el=>{
    el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400);
  });
}

function finish(won){
  const p=PUZZLES[pIdx];
  const title = won ? 'Geschafft' : 'Verloren';
  const text = won
    ? (mistakes===0 ? 'Alle vier Gruppen ohne einen einzigen Fehler. Sehr stark.'
       : 'Alle vier Gruppen gefunden — mit '+mistakes+(mistakes===1?' Fehler.':' Fehlern.'))
    : 'Vier Fehler. Die Auflösung steht oben.';
  const r=document.getElementById('result');
  r.innerHTML='<h2>'+title+'</h2><p>'+text+'</p>'+
    (p.note?'<p class="hint">'+p.note+'</p>':'')+
    '<div class="rbtns">'+
      '<button onclick="nextPuzzle()">Nächstes Rätsel</button>'+
      '<button class="ghost" onclick="restart()">Nochmal</button>'+
    '</div>';
  setTimeout(()=>{
    document.getElementById('status').style.display='none';
    document.getElementById('btns').style.display='none';
    r.classList.add('on');
    if(r.scrollIntoView) r.scrollIntoView({behavior:'smooth',block:'nearest'});
  }, won?520:820);
}

function nextPuzzle(){ load(pIdx+1); }
function restart(){ load(pIdx); }

/* ── Service worker ──────────────────────────────────────────────
   The page is served network-first, so a deploy is normally live on
   the next launch. This also listens for a waiting worker and takes
   it over straight away rather than leaving it a launch behind.   */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/word-quartet/sw.js')
      .then(function(reg){
        reg.update();
        reg.addEventListener('updatefound',function(){
          var nw=reg.installing;
          if(!nw) return;
          nw.addEventListener('statechange',function(){
            if(nw.state==='installed' && navigator.serviceWorker.controller){
              nw.postMessage('SKIP_WAITING');
            }
          });
        });
      })
      .catch(function(){ /* offline or unsupported — the game still runs */ });
    // Only reload when an EXISTING worker is replaced. On a first visit
    // clients.claim() also fires controllerchange, and reloading then
    // would bounce the page for no reason.
    var hadController = !!navigator.serviceWorker.controller, reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!hadController || reloading) return;
      reloading=true;
      window.location.reload();
    });
  });
}

load(Math.floor(Math.random()*PUZZLES.length));
